# 7B user-sim 版 interaction 配置（GRPO 7B 冒烟用，GPU1 独占 :8001）
interaction:
  - name: "tau_bench_airline"
    class_name: "src.envs.tau_bench_interaction.TauBenchInteraction"
    config:
      env_name: "airline"
      user_strategy: "llm"
      user_model: "Qwen/Qwen2.5-7B-Instruct"
      user_provider: "openai"
      user_base_url: "http://localhost:8001/v1"
      task_split: "test"
      max_turns: 4
