# 4090 版 SFT 数据采集配置（cancon HPC 2×RTX4090）
# 原版 sft_collect_airline.yaml 用 72B-AWQ 双卡 A800；此处降为 7B 双卡：
#   - GPU 0 (port 8000): Qwen2.5-7B-Instruct 当 policy 跑 trajectory (best-of-16)
#   - GPU 1 (port 8001): Qwen2.5-7B-Instruct 当 user simulator
# 7B 在 airline 上 pass@1 ~30-40%，best-of-16 的全覆盖概率 >99.9%
# 采集质量低于原版 72B（正式复现时用 A800 跑原版），链路与数据格式完全一致

env:
  name: airline
  user_strategy: llm
  user_model: "Qwen/Qwen2.5-7B-Instruct"
  user_provider: openai
  user_base_url: "http://localhost:8001/v1"
  task_split: test

policy:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  base_url: "http://localhost:8000/v1"
  top_p: 0.9
  max_tokens: 512

collect:
  best_of_n: 16
  temperatures: [0.0, 0.0, 0.0, 0.0, 0.5, 0.5, 0.5, 0.5, 0.8, 0.8, 0.8, 0.8, 1.0, 1.0, 1.0, 1.0]
  max_turns: 30
  num_workers: 4
  holdout_size: 10

output:
  dir: "experiments/sft_collect_airline"
